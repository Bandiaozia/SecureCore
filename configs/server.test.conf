# SecureCore deterministic test configuration

environment=test
listen_address=127.0.0.1
listen_port=19090
log_file=logs/securecore-test.log
database_path=data/securecore-test.db
io_threads=2
worker_threads=2
worker_queue_capacity=32
tls_enabled=false
tls_handshake_timeout_seconds=2
http_max_connections=64
http_rate_limit_requests=1000
http_rate_limit_window_seconds=1
http_max_header_bytes=4096
http_max_body_bytes=4096
http_read_timeout_seconds=2
http_write_timeout_seconds=2
http_idle_timeout_seconds=2
