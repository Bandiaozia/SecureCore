# SecureCore deterministic test configuration

environment=test
listen_address=127.0.0.1
listen_port=19090
log_file=logs/securecore-test.log
database_path=data/securecore-test.db
database_pool_size=2
database_acquire_timeout_ms=1000
io_threads=2
worker_threads=2
worker_queue_capacity=32
tls_enabled=false
tls_handshake_timeout_seconds=2
trusted_proxy_cidrs=none
proxy_forwarded_header_max_bytes=4096
cors_allowed_origins=*
cors_allow_credentials=false
cors_max_age_seconds=60
hsts_enabled=true
hsts_max_age_seconds=31536000
hsts_include_subdomains=true
hsts_preload=false
http_max_connections=64
http_rate_limit_requests=1000
http_rate_limit_window_seconds=1
http_rate_limit_max_buckets=4096
http_max_header_bytes=4096
http_max_body_bytes=4096
http_read_timeout_seconds=2
http_write_timeout_seconds=2
http_idle_timeout_seconds=2
audit_retention_days=90
metrics_require_auth=false
registration_enabled=true

auth_login_account_failure_limit=5
auth_login_ip_failure_limit=20
auth_login_failure_window_seconds=300
auth_login_lockout_seconds=300
auth_login_max_lockout_seconds=3600
auth_login_max_tracked_accounts=4096
auth_login_max_tracked_ips=4096
