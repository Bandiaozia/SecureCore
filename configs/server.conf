# SecureCore server configuration

environment=development

listen_address=127.0.0.1
listen_port=9090

log_file=logs/securecore.log
database_path=data/securecore.db
database_pool_size=4
database_acquire_timeout_ms=5000

io_threads=4
worker_threads=4
worker_queue_capacity=256
shutdown_grace_period_ms=10000
audit_retention_days=90
metrics_require_auth=false

# Login abuse protection. Lockout duration doubles after repeated lockouts
# until auth_login_max_lockout_seconds is reached.
auth_login_account_failure_limit=5
auth_login_ip_failure_limit=20
auth_login_failure_window_seconds=300
auth_login_lockout_seconds=300
auth_login_max_lockout_seconds=3600

# TLS is disabled for local development.
# For public deployment, enable TLS and provide a PEM certificate chain
# and matching PEM private key.
tls_enabled=false
# tls_certificate_file=certs/fullchain.pem
# tls_private_key_file=certs/privatekey.pem
tls_handshake_timeout_seconds=10

# Reverse-proxy security. Forwarding headers are ignored unless the direct
# peer address belongs to one of these CIDRs. Use "none" for direct deployments.
trusted_proxy_cidrs=none
proxy_forwarded_header_max_bytes=4096

# Browser cross-origin policy. Wildcard is acceptable for local development,
# but production requires an explicit comma-separated allowlist.
cors_allowed_origins=*
cors_allow_credentials=false
cors_max_age_seconds=600

# HSTS is emitted only when the request is HTTPS directly or a trusted proxy
# reports X-Forwarded-Proto=https / Forwarded: proto=https.
hsts_enabled=true
hsts_max_age_seconds=31536000
hsts_include_subdomains=true
hsts_preload=false

http_max_connections=1024

http_rate_limit_requests=100
http_rate_limit_window_seconds=1

http_max_header_bytes=16384
http_max_body_bytes=1048576

http_read_timeout_seconds=10
http_write_timeout_seconds=10
http_idle_timeout_seconds=30
