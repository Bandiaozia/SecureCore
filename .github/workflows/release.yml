name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to build, without the leading v
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build reproducible release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: scripts/ci/install-dependencies.sh

      - name: Resolve version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
              version="${GITHUB_REF_NAME#v}"
          else
              version="${DISPATCH_VERSION#v}"
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid semantic version: $version" >&2
              exit 2
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build first release archive
        env:
          SECURECORE_RELEASE_COMMIT: ${{ github.sha }}
        run: >-
          scripts/ci/build-release.sh
          "${{ steps.version.outputs.version }}"
          release-first

      - name: Build second release archive
        env:
          SECURECORE_RELEASE_COMMIT: ${{ github.sha }}
        run: >-
          scripts/ci/build-release.sh
          "${{ steps.version.outputs.version }}"
          release-second

      - name: Verify reproducibility
        run: |
          set -euo pipefail

          first_archive="$(find release-first -maxdepth 1 -name '*.tar.gz' -type f -print -quit)"
          second_archive="$(find release-second -maxdepth 1 -name '*.tar.gz' -type f -print -quit)"

          test -n "$first_archive"
          test -n "$second_archive"

          if ! cmp --silent "$first_archive" "$second_archive"; then
              echo "Release archives are not reproducible." >&2
              sha256sum "$first_archive" "$second_archive" >&2

              rm -rf reproducibility-diagnostics
              mkdir -p \
                  reproducibility-diagnostics/first \
                  reproducibility-diagnostics/second

              tar -xzf "$first_archive" \
                  -C reproducibility-diagnostics/first
              tar -xzf "$second_archive" \
                  -C reproducibility-diagnostics/second

              diff \
                  --recursive \
                  --unified \
                  --no-dereference \
                  reproducibility-diagnostics/first \
                  reproducibility-diagnostics/second \
                  > reproducibility-diagnostics/diff.txt \
                  || true

              sed -n '1,240p' \
                  reproducibility-diagnostics/diff.txt \
                  >&2

              exit 1
          fi

          mkdir -p dist
          cp "$first_archive" dist/
          cp "$first_archive.sha256" dist/

          (
              cd dist
              sha256sum --check "$(basename "$first_archive.sha256")"
          )

      - name: Upload reproducibility failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducibility-failure
          path: |
            reproducibility-diagnostics/
            release-first/*.tar.gz
            release-second/*.tar.gz
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SecureCore-${{ steps.version.outputs.version }}-linux
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attest and publish release
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SecureCore-${{ needs.release.outputs.version }}-linux
          path: dist

      - name: Generate build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/*.tar.gz

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
              dist/* \
              --verify-tag \
              --generate-notes \
              --title "SecureCore ${{ needs.release.outputs.version }}"
